<!doctype html>
<meta charset="utf-8">
<title>Amplified glow — the compositor sequence against the Ruffle oracle</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; image-rendering: pixelated; }
</style>
<!--
  THE ACCEPTANCE TEST FOR `glowAmplificationFor`, RUN BEFORE THE COMPOSITOR IS
  TOUCHED.

  `index.html` draws the ladder through `ctx.filter` alone, which is what this
  renderer shipped and what cannot express `strength`. This page runs the exact
  sequence `glowAmplificationFor` describes — silhouette, additive amplify,
  `source-in` colourise, draw under — on the same source, at the same scale, in
  the same six cells.

  The target, measured under Ruffle by `tools/swf-probe.mjs glow`, is the blue
  channel outward from the source edge in movie pixels:

      strength     0    1    2    3
             1    63   39   26    2
             2   126   78   52    4
             4   252  156  104    8
            10   255  255  255   30
            16   255  255  255   48

  ► **STRENGTH 1 IS THE NULL CONTROL AND IT IS WHY IT IS IN THE LADDER.** At
    strength 1 the old `drop-shadow` path is already exact, so this page and
    `index.html` must agree there AND both must match the oracle's first row. If
    they diverge at 1, the sequence is wrong and every other row is noise.

  ► **THE BUFFERS ARE PER CELL, mirroring the compositor's per-group region.**
    Doing all six in one buffer would let one cell's blur bleed into its
    neighbour and be measured as its glow.
-->
<canvas id="stage" width="600" height="100"></canvas>
<script type="module">
import { glowAmplificationFor, canvasFilterFor } from "/src/render/filters.js";

const STRENGTHS = [0.5, 1, 2, 4, 10, 16];
const CELL = 100;
const BOX = 24;
const GLOW = { red: 0, green: 204, blue: 255, alpha: 255 };
const recordFor = (strength) => ({
  type: "glow", colour: GLOW, blurX: 8, blurY: 8, strength,
  passes: 1, inner: false, knockout: false
});

const canvas = document.getElementById("stage");
const context = canvas.getContext("2d");

/** A scratch canvas of the cell's size. Pooled, because a frame loop runs this. */
const pool = new Map();
function scratch(key) {
  let found = pool.get(key);
  if (!found) {
    const element = document.createElement("canvas");
    element.width = CELL;
    element.height = CELL;
    found = { canvas: element, context: element.getContext("2d") };
    pool.set(key, found);
  }
  const ctx = found.context;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.filter = "none";
  ctx.clearRect(0, 0, CELL, CELL);
  return found;
}

/**
 * ONE FLASH FILTER APPLIED TO A BITMAP — the sequence, and nothing else.
 *
 * This is deliberately written to be transcribable into `paintGroupRuns`
 * unchanged: it takes a source canvas and returns a new one, and every
 * `globalCompositeOperation` and `globalAlpha` it sets it also resets.
 */
function applyAmplifiedGlow(source, step) {
  // 1. SILHOUETTE. White, so that the additive step below cannot distort a hue:
  //    white is the only colour whose premultiplied channels equal its alpha.
  const silhouette = scratch("silhouette");
  silhouette.context.filter = step.silhouette;
  silhouette.context.drawImage(source.canvas, 0, 0);
  silhouette.context.filter = "none";

  // 2. AMPLIFY. `lighter` sums premultiplied channels and clamps at 1, so what
  //    comes out is exactly min(1, blurredAlpha * strength). An identity.
  const accumulator = scratch("accumulator");
  accumulator.context.globalCompositeOperation = "lighter";
  for (let draw = 0; draw < step.repeats; draw += 1) {
    accumulator.context.globalAlpha = draw === step.repeats - 1 ? step.lastAlpha : 1;
    accumulator.context.drawImage(silhouette.canvas, 0, 0);
  }
  accumulator.context.globalAlpha = 1;

  // 3. COLOURISE. The amplified alpha, wearing the glow's own colour — which
  //    also erases the source's colours that rode along inside the silhouette.
  accumulator.context.globalCompositeOperation = "source-in";
  accumulator.context.fillStyle = step.colour;
  accumulator.context.fillRect(0, 0, CELL, CELL);
  accumulator.context.globalCompositeOperation = "source-over";

  // 4. UNDER. The glow, then the bitmap it was cast by, on top of it.
  const out = scratch("out");
  out.context.drawImage(accumulator.canvas, 0, 0);
  out.context.drawImage(source.canvas, 0, 0);
  return out;
}

function draw() {
  context.setTransform(1, 0, 0, 1, 0, 0);
  context.fillStyle = "#000000";
  context.fillRect(0, 0, canvas.width, canvas.height);

  STRENGTHS.forEach((strength, index) => {
    // The source, in its own cell-local space.
    let current = scratch("source");
    current.context.fillStyle = "#ffffff";
    current.context.fillRect((CELL - BOX) / 2, (CELL - BOX) / 2, BOX, BOX);

    const plan = glowAmplificationFor([recordFor(strength)], { scale: 1 });
    if (plan) {
      // `scratch` reuses by key, so the source must be copied out before the
      // steps start reusing those keys — otherwise step 1 clears its own input.
      const held = scratch("held");
      held.context.drawImage(current.canvas, 0, 0);
      current = held;
      for (const step of plan.steps) {
        const result = applyAmplifiedGlow(current, step);
        const keep = scratch("keep");
        keep.context.drawImage(result.canvas, 0, 0);
        current = keep;
      }
    } else {
      // DECLINED — the old path, which for strength below the clamp is exact.
      const { filter } = canvasFilterFor([recordFor(strength)], { scale: 1 });
      const shadowed = scratch("shadowed");
      shadowed.context.filter = filter || "none";
      shadowed.context.drawImage(current.canvas, 0, 0);
      shadowed.context.filter = "none";
      current = shadowed;
    }

    context.drawImage(current.canvas, index * CELL, 0);
  });
}

(function frame() { draw(); requestAnimationFrame(frame); })();
window.__amplified = { strengths: STRENGTHS, cell: CELL, box: BOX };
</script>
