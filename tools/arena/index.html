<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — a rendered surface for the team resolver</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8e4dc;
    --ink-dim: #9a9287;
    --ground: #17151a;
    --panel: #211e26;
    --edge: #3a3542;
    --hero: #8c2f39;
    --villain: #2f4858;
    --warn: #d8a13a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
    display: flex;
    gap: 16px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  /* The master volume: pushed to the header's far end, readable at a glance. */
  .volume {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-dim); font-size: 12px;
  }
  .volume input { width: 120px; accent-color: var(--warn); }
  .volume output { min-width: 3.5em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tier {
    color: var(--warn);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .04em;
  }
  main { flex: 1; display: flex; gap: 0; flex-wrap: wrap; align-items: stretch; }
  /* The stage and, under it, the ring's strip (slice S2). The column takes the
     place the stage had in the row; the stage fills what the strip leaves. */
  .stage-column { flex: 1 1 620px; min-width: 320px; display: flex; flex-direction: column; }
  /* H3: the turn-order strip, just above the stage and outside it — every
     fighter in the engine's initiative order. A FIXED height, like the ring's
     strip below, so the stage is the same size on every turn — and it never
     SCROLLS: a classic scrollbar would eat that height (Codex review of H3,
     pass 1), so on a narrow stage the chips shrink and the names end in an
     ellipsis, each chip carrying the whole name as its title. A chip names
     its side by its name's colour ALONE (D1, 2026-09-24: ~~an initial on a
     disc, and a bottom border in the side's colour~~ — "Colors suffice");
     the chip whose turn it is is ringed in --warn, never underlined. */
  .turn-strip {
    flex: 0 0 auto; height: 30px; margin: 0; padding: 0 10px; list-style: none;
    display: flex; gap: 4px; align-items: center;
    overflow: hidden;
    border-bottom: 1px solid var(--edge); background: var(--panel);
  }
  .turn-chip {
    flex: 0 1 auto; min-width: 0; display: inline-flex; align-items: center; gap: 0; padding: 1px 7px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: var(--ground); font-size: 12px; line-height: 1.4;
  }
  .turn-chip .turn-name {
    color: var(--team, var(--ink)); font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .turn-chip.current { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn); }
  .turn-chip.down { opacity: .45; }
  .turn-chip.down .turn-name { text-decoration: line-through; }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas:focus-visible { outline: 2px solid var(--warn); outline-offset: -2px; }
  /* A FIXED height, so the stage does not change size from one turn to the next. */
  .ring-strip {
    flex: 0 0 auto; height: 132px; overflow-y: auto;
    border-top: 1px solid var(--edge); background: var(--panel);
    padding: 8px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .ring-strip[hidden] { display: none; }
  .ring-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .ring-row:empty { display: none; }
  .ring-row > b {
    min-width: 4.5em; color: var(--ink-dim); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .ring-row button { padding: 3px 9px; }
  .ring-row button[aria-pressed="true"] { border-color: #f2c14e; color: #f2c14e; }
  /* S9: a button the team rules forbid this turn — listed, reachable by the
     keyboard (aria-disabled, not disabled), dimmed; pressing it says why. */
  .ring-row button[aria-disabled="true"] { opacity: .5; border-style: dashed; cursor: not-allowed; }
  .ring-row kbd { font: inherit; font-size: 11px; font-weight: 700; color: var(--warn); }
  .ring-status { margin: 0; font-size: 11.5px; color: var(--ink-dim); }
  /* S7: the preview line — what the hovered or focused button will do — with
     Confirm and Back while "confirm every move" is on, and the setting itself. */
  .ring-preview-text { flex: 1 1 18em; min-width: 0; font-size: 12px; }
  .ring-confirm-toggle {
    margin-left: auto; display: inline-flex; gap: 5px; align-items: center;
    font-size: 11.5px; color: var(--ink-dim); cursor: pointer;
  }
  .ring-confirm-toggle input { accent-color: var(--warn); margin: 0; }
  #ring-confirm-go:not(:disabled) { border-color: #f2c14e; color: #f2c14e; }
  .ring-odds { font-size: 11.5px; color: var(--ink-dim); margin-left: 4px; }
  /* S8: the AI row — between a person's turns only. The skip is a toggle: pressed, it is gold. */
  .ring-row[hidden] { display: none; }
  .ring-pace-hint, .ring-pace-state { font-size: 11.5px; color: var(--ink-dim); }
  .ring-pace-hint kbd { font: inherit; font-weight: 700; color: var(--warn); }
  .ring-pace-state { color: var(--ink); }
  #ring-skip[aria-pressed="true"] { border-color: #f2c14e; color: #f2c14e; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  aside {
    flex: 0 1 330px;
    min-width: 280px;
    border-left: 1px solid var(--edge);
    background: var(--panel);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 100vh;
    overflow-y: auto;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); margin: 0 0 6px; }
  /* H2: the crowd meter, at the top of the side panel — the build's own label
     ("crowd: <mood>"), the number, and the bar with the lines under 20 and over
     70 where the build's boos and cheers can start. */
  .crowd { display: flex; flex-direction: column; gap: 4px; }
  .crowd[hidden] { display: none; }
  .crowd-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; }
  .crowd-line output { color: var(--ink-dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .crowd-bar { position: relative; height: 8px; border-radius: 4px; background: #000; }
  .crowd-bar > i { display: block; height: 100%; border-radius: 4px; background: var(--warn); }
  .crowd-bar[data-band="boo"] > i { background: #8a7f73; }
  .crowd-bar[data-band="cheer"] > i { background: #f2c14e; }
  .crowd-bar > b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-dim); }
  /* H2: the two team panels, red then blue. Each carries its side's colour
     (--team, set from tools/arena/team-hud.js) on its top edge, its heading,
     each row's left edge and each name — and that colour is the side's only
     cue (D1, 2026-09-24: ~~and its initial in a disc: a cue that is not
     colour alone~~). The rows sit on --ground: the side panel's own --panel
     gives red only 4.44 : 1, --ground 4.90 (blue 5.45). */
  .roster { display: flex; flex-direction: column; gap: 12px; }
  .team-panel { border-top: 3px solid var(--team, var(--edge)); padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .team-heading {
    display: flex; align-items: center; gap: 0; margin: 0; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: var(--team, var(--ink));
  }
  .team-standing { margin-left: auto; color: var(--ink-dim); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .team-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fighter {
    border: 1px solid var(--edge); border-left: 3px solid var(--team, var(--edge));
    border-radius: 5px; padding: 6px 8px; background: var(--ground);
  }
  .fighter.acting { border-color: var(--warn); border-left-color: var(--team, var(--warn)); box-shadow: 0 0 0 1px var(--warn); }
  .fighter.down { opacity: .45; }
  .fighter .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .fighter .name { font-weight: 600; color: var(--team, var(--ink)); }
  .fighter .tags { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .tag, .seat {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    padding: 0 5px; border-radius: 3px; border: 1px solid var(--edge); color: var(--ink-dim);
  }
  .tag.turn { border-color: var(--warn); color: var(--warn); }
  .seat.you { border-color: #f2c14e; color: #f2c14e; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid #6b4f2a; background: #2e2417; color: #f3d9a8; cursor: help; }
  .reading {
    display: grid; grid-template-columns: 4.3em 1fr auto; gap: 6px; align-items: center;
    margin-top: 3px; font-size: 11px; color: var(--ink-dim);
  }
  .reading .meter { height: 6px; border-radius: 3px; background: #000; overflow: hidden; }
  .reading .meter > i { display: block; height: 100%; }
  .reading.health .meter > i { background: #6ea84f; }
  .reading.health.hurt .meter > i { background: #b8562f; }
  .reading.energy .meter > i { background: #d8a13a; }
  .reading.armour .meter > i { background: #9aa7b8; }
  .reading .num { min-width: 5.5em; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-direction: column; gap: 5px; }
  button {
    font: inherit; text-align: left; cursor: pointer;
    background: #2c2833; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 5px; padding: 6px 9px;
  }
  button:hover:not(:disabled) { background: #383243; }
  button:disabled { opacity: .4; cursor: default; }
  /* S7: a plain-list action chosen with "confirm every move" on, waiting for its Confirm. */
  .actions button[aria-pressed="true"] { border-color: #f2c14e; color: #f2c14e; }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--ink-dim); }
  .log div { padding: 1px 0; }
  .log .warn { color: var(--warn); }
  .provenance { font-size: 11.5px; color: var(--ink-dim); }
  .provenance b { color: var(--ink); font-weight: 600; }
  footer {
    padding: 8px 16px; border-top: 1px solid var(--edge);
    font-size: 11.5px; color: var(--ink-dim);
  }

    /* The blocked-audio prompt: over the stage, impossible to scroll past, and
       it removes itself on the click that fixes the thing it is warning about. */
    #stage { position: relative; }
    #audio-prompt {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
      z-index: 5; cursor: pointer; font: inherit; font-size: 0.95rem;
      padding: 0.55rem 1rem; border-radius: 999px;
      border: 1px solid #c9a227; background: #2a2208; color: #f3e3a8;
      box-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }
    #audio-prompt:hover { background: #3a2f0b; }
  </style>
</head>
<body>
  <header>
    <h1>The Arena</h1>
    <span class="tier" id="tier">loading…</span>
    <span class="provenance" id="seed"></span>
    <label class="volume" for="volume">Volume
      <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-describedby="volume-readout">
      <output id="volume-readout" for="volume">100%</output>
    </label>
  </header>
  <main>
    <div class="stage-column">
      <ol class="turn-strip" id="turn-strip" aria-label="Turn order"></ol>
      <div id="stage"><canvas id="arena" tabindex="0" aria-label="The arena. On your turn: click a button around your fighter, or a foe to target him. Keys: 1 to 8 press the buttons, 9 swaps weapons when you carry two, Q to Y use your items and spells, the arrow keys walk left and right and step back or forward a rank, Tab and Shift+Tab change the target, Esc moves to the list of actions under the stage. With Confirm every move on, a key or click only chooses: Enter confirms and Esc takes it back. A dimmed button is not on offer now: point at it, or press its key, to hear why. While the AI plays, hold Shift to speed it up, or press Skip to my turn under the stage."></canvas></div>
      <section class="ring-strip" id="ring-strip" aria-label="Your actions" data-state="idle" hidden>
        <div class="ring-row" id="ring-preview" role="group" aria-label="Preview and confirm">
          <b>Preview</b>
          <span class="ring-preview-text" id="ring-preview-text"></span>
          <button type="button" id="ring-confirm-go" aria-keyshortcuts="Enter" hidden disabled><kbd>Enter</kbd> Confirm</button>
          <button type="button" id="ring-confirm-back" aria-keyshortcuts="Escape" hidden disabled><kbd>Esc</kbd> Back</button>
          <label class="ring-confirm-toggle"><input type="checkbox" id="ring-confirm"> Confirm every move</label>
        </div>
        <div class="ring-row" id="ring-target" role="group" aria-label="Target"></div>
        <div class="ring-row" id="ring-slots" role="group" aria-label="The ring"></div>
        <div class="ring-row" id="ring-items" role="group" aria-label="Items and spells"></div>
        <div class="ring-row" id="ring-off" role="group" aria-label="More actions"></div>
        <p class="ring-status" id="ring-status"></p>
        <div class="ring-row" id="ring-pace" role="group" aria-label="The AI's turns" hidden>
          <b>AI</b>
          <button type="button" id="ring-skip" aria-pressed="false" disabled>Skip to my turn</button>
          <span class="ring-pace-hint">Hold <kbd>Shift</kbd> to draw the AI's turns at 4×.</span>
          <span class="ring-pace-state" id="ring-pace-state"></span>
        </div>
        <div id="ring-descriptions" hidden></div>
      </section>
      <div class="visually-hidden" id="ring-live" aria-live="polite"></div>
    </div>
    <aside>
      <section class="crowd" id="crowd" aria-label="The crowd" hidden>
        <div class="crowd-line"><span id="crowd-text"></span><output id="crowd-value" aria-hidden="true"></output></div>
        <div class="crowd-bar" id="crowd-bar" role="meter" aria-label="Crowd" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="crowd-fill"></i><b id="crowd-boo" title="Below this the crowd may boo"></b><b id="crowd-cheer" title="Above this the crowd may cheer"></b></div>
      </section>
      <section>
        <h2>Teams</h2>
        <div class="roster" id="roster"></div>
      </section>
      <section>
        <h2 id="turn-heading">Your turn</h2>
        <div class="actions" id="actions"></div>
      </section>
      <section>
        <h2>What you are looking at</h2>
        <div class="provenance" id="provenance"></div>
      </section>
      <section>
        <h2>Surface log</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="/tools/arena/main.js"></script>
</body>
</html>
