<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — a rendered surface for the team resolver</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8e4dc;
    --ink-dim: #9a9287;
    --ground: #17151a;
    --panel: #211e26;
    --edge: #3a3542;
    --hero: #8c2f39;
    --villain: #2f4858;
    --warn: #d8a13a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--edge);
    display: flex;
    gap: 16px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  /* The master volume: pushed to the header's far end, readable at a glance. */
  .volume {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 8px;
    color: var(--ink-dim); font-size: 12px;
  }
  .volume input { width: 120px; accent-color: var(--warn); }
  .volume output { min-width: 3.5em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tier {
    color: var(--warn);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .04em;
  }
  main { flex: 1; display: flex; gap: 0; flex-wrap: wrap; align-items: stretch; }
  /* The stage and, under it, the ring's strip (slice S2). The column takes the
     place the stage had in the row; the stage fills what the strip leaves. */
  .stage-column { flex: 1 1 620px; min-width: 320px; display: flex; flex-direction: column; }
  #stage { flex: 1 1 auto; min-height: 0; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas:focus-visible { outline: 2px solid var(--warn); outline-offset: -2px; }
  /* A FIXED height, so the stage does not change size from one turn to the next. */
  .ring-strip {
    flex: 0 0 auto; height: 132px; overflow-y: auto;
    border-top: 1px solid var(--edge); background: var(--panel);
    padding: 8px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .ring-strip[hidden] { display: none; }
  .ring-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .ring-row:empty { display: none; }
  .ring-row > b {
    min-width: 4.5em; color: var(--ink-dim); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .ring-row button { padding: 3px 9px; }
  .ring-row button[aria-pressed="true"] { border-color: #f2c14e; color: #f2c14e; }
  .ring-row kbd { font: inherit; font-size: 11px; font-weight: 700; color: var(--warn); }
  .ring-status { margin: 0; font-size: 11.5px; color: var(--ink-dim); }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
  aside {
    flex: 0 1 330px;
    min-width: 280px;
    border-left: 1px solid var(--edge);
    background: var(--panel);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 100vh;
    overflow-y: auto;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); margin: 0 0 6px; }
  .roster { display: flex; flex-direction: column; gap: 6px; }
  .fighter { border: 1px solid var(--edge); border-radius: 5px; padding: 6px 8px; }
  .fighter.acting { border-color: var(--warn); }
  .fighter.down { opacity: .45; }
  .fighter .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .fighter .name { font-weight: 600; }
  .fighter .slot { color: var(--ink-dim); font-size: 11px; }
  .bar { height: 6px; border-radius: 3px; background: #000; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: #6ea84f; }
  .bar.hurt > i { background: #b8562f; }
  .actions { display: flex; flex-direction: column; gap: 5px; }
  button {
    font: inherit; text-align: left; cursor: pointer;
    background: #2c2833; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 5px; padding: 6px 9px;
  }
  button:hover:not(:disabled) { background: #383243; }
  button:disabled { opacity: .4; cursor: default; }
  .log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--ink-dim); }
  .log div { padding: 1px 0; }
  .log .warn { color: var(--warn); }
  .provenance { font-size: 11.5px; color: var(--ink-dim); }
  .provenance b { color: var(--ink); font-weight: 600; }
  footer {
    padding: 8px 16px; border-top: 1px solid var(--edge);
    font-size: 11.5px; color: var(--ink-dim);
  }

    /* The blocked-audio prompt: over the stage, impossible to scroll past, and
       it removes itself on the click that fixes the thing it is warning about. */
    #stage { position: relative; }
    #audio-prompt {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
      z-index: 5; cursor: pointer; font: inherit; font-size: 0.95rem;
      padding: 0.55rem 1rem; border-radius: 999px;
      border: 1px solid #c9a227; background: #2a2208; color: #f3e3a8;
      box-shadow: 0 2px 12px rgba(0,0,0,0.45);
    }
    #audio-prompt:hover { background: #3a2f0b; }
  </style>
</head>
<body>
  <header>
    <h1>The Arena</h1>
    <span class="tier" id="tier">loading…</span>
    <span class="provenance" id="seed"></span>
    <label class="volume" for="volume">Volume
      <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-describedby="volume-readout">
      <output id="volume-readout" for="volume">100%</output>
    </label>
  </header>
  <main>
    <div class="stage-column">
      <div id="stage"><canvas id="arena" tabindex="0" aria-label="The arena. On your turn: click a button around your fighter, or a foe to target him. Keys: 1 to 8 press the buttons, the arrow keys walk left and right and step back or forward a rank, Tab and Shift+Tab change the target, Esc moves to the list of actions under the stage."></canvas></div>
      <section class="ring-strip" id="ring-strip" aria-label="Your actions" data-state="idle" hidden>
        <div class="ring-row" id="ring-target" role="group" aria-label="Target"></div>
        <div class="ring-row" id="ring-slots" role="group" aria-label="The ring"></div>
        <div class="ring-row" id="ring-off" role="group" aria-label="More actions"></div>
        <p class="ring-status" id="ring-status"></p>
      </section>
      <div class="visually-hidden" id="ring-live" aria-live="polite"></div>
    </div>
    <aside>
      <section>
        <h2>Roster</h2>
        <div class="roster" id="roster"></div>
      </section>
      <section>
        <h2 id="turn-heading">Your turn</h2>
        <div class="actions" id="actions"></div>
      </section>
      <section>
        <h2>What you are looking at</h2>
        <div class="provenance" id="provenance"></div>
      </section>
      <section>
        <h2>Surface log</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="/tools/arena/main.js"></script>
</body>
</html>
